<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>
    <link rel="stylesheet" href="blue.css">
</head>
<body>


<header id="header">
    <h1>User Registration Portal</h1>
    <p>Login  •  Registration  •  Account Access</p>
</header>
<nav id="menu">

    <a href="first.html">Home</a>
    <a href="#">About</a>
    <a href="#">Contact Us</a>
    <a href="second.html">Register</a>

</nav> 
<hr>


<main>
    <form action="second.html" method="get">



<div id="loginBox">

    <div id="loginTitle">
        Login to Continue
    </div>



    <div id="usernameRow">

        <div id="usernameLabel">
            <label for="username">Username:</label>
        </div>

        <div id="usernameInput">
            <input type="text" id="username" name="username" required>
        </div>

    </div>



    <div id="passwordRow">

        <div id="passwordLabel">
            <label for="password">Password:</label>
        </div>

        <div id="passwordInput">
            <input type="password" id="password" name="password" required>
        </div>

    </div>



    <div id="loginButtons">
        <input type="reset" value="Reset">
        <input type="submit" value="Login">
    </div>

</div>



    </form>
</main>


<hr>
<footer id="footer">
    <p>© 2026 My Website | All Rights Reserved</p>
</footer>



</body>
</html>
