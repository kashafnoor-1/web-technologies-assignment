<!DOCTYPE html>
<html>

<head>
    <title>Registration Page</title>
</head>

<body>

<header align="center">
    <h1>User Registration Portal</h1>
</header>

<hr>

<br><br>

<main>
    <form action="third.html" method="get">
        <table border="1" cellpadding="10" cellspacing="0" align="center">
            <thead>
                <tr>
                    <th colspan="2">Create Your Account</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><label for="loginname">Login Name:</label></td>
                    <td><input type="text" id="loginname" name="loginname" required></td>
                </tr>

                <tr>
                    <td><label for="password">Enter Password:</label></td>
                    <td><input type="password" id="password" name="password" required></td>
                </tr>

                <tr>
                    <td><label for="repassword">Re-enter Password:</label></td>
                    <td><input type="password" id="repassword" name="password" required></td>
                </tr>

                <tr>
                    <td>Gender:</td>
                    <td>
                        <input type="radio" id="male" name="gender" value="male">
                        <label for="male">Male</label>
                        <input type="radio" id="female" name="gender" value="female">
                        <label for="female">Female</label>
                    </td>
                </tr>

                <tr>
                    <td><label for="country">Country:</label></td>
                    <td>
                        <select id="country" name="country">
                            <option>China</option>
                            <option>Japan</option>
                            <option>Pakistan</option>
                            <option>UAE</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td><label for="license">License:</label></td>
                    <td>
                        <textarea id="license" name="license" rows="3" cols="25">I agree to follow all the terms and conditions.</textarea>
                    </td>
                </tr>

                <tr>
                    <td></td>
                    <td>
                        <input type="checkbox" id="agreement" name="agreement" required>
                        <label for="agreement">I agree to the license.</label>
                    </td>
                </tr>

                <tr>
                    <td colspan="2" align="center">
                        <input type="submit" value="Register">
                        <input type="reset" value="Reset">
                    </td>
                </tr>
            </tbody>
        </table>
    </form>
</main>

<br><br>
<hr>

<footer align="center">
    <p>© 2026 Student Web Portal | All Rights Reserved</p>
</footer>

</body>
</html>
