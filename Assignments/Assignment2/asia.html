<!DOCTYPE html>
<html>

<head>
    <title>Pakistan</title>
</head>

<body style="background-color:#FAFAFA;">

<header style="background:#DCEFEF; text-align:center; padding:20px;">
    <h1>Pakistan</h1>
    <p>Map and National Anthem</p>
</header>

<h2 style="text-align:center;">Pakistan Map and National Anthem</h2>

<table border="1" cellpadding="15" cellspacing="0" align="center">

    <tr>

        <!-- Pakistan Map -->
        <td style="text-align:center;">

            <h3>Pakistan Map</h3>

            <img src="maps/pakistan-map.png"
                 width="500"
                 height="500"
                 style="object-fit:contain;">

        </td>


        <!-- National Anthem Video -->
        <td style="text-align:center;">

            <h3>National Anthem</h3>

            <video width="500"
                   height="500"
                   controls
                   style="object-fit:cover;">

                <source src="videos/pakistan-national-anthem.mp4"
                        type="video/mp4">

            </video>

        </td>

    </tr>

</table>

</body>
</html>
